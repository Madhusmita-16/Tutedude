<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 3: DOM Implementation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 100%);
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Poppins', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        /* Glassmorphism Card Container */
        .app-card {
            width: 100%;
            max-width: 820px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid var(--card-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(99, 102, 241, 0.1);
            padding: 50px 45px;
            text-align: center;
        }

        /* Title Badge */
        .badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
            border: 1px solid rgba(129, 140, 248, 0.3);
        }

        /* Greeting Header */
        .greeting-header {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
            min-height: 70px;
            letter-spacing: -0.5px;
            transition: all 0.3s ease;
        }

        /* Color Boxes Grid */
        .boxes-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 45px;
        }

        .color-box {
            height: 130px;
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            font-weight: 700;
            color: #94a3b8;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .color-box:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.3);
            color: #ffffff;
        }

        /* Active Glow Styles */
        .color-box.red-active {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: #ffffff;
            border-color: #f87171;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.45);
        }

        .color-box.blue-active {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: #ffffff;
            border-color: #60a5fa;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.45);
        }

        .color-box.green-active {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #ffffff;
            border-color: #4ade80;
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.45);
        }

        .color-box.yellow-active {
            background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
            color: #0f172a;
            border-color: #fde047;
            box-shadow: 0 10px 30px rgba(234, 179, 8, 0.45);
        }

        /* Input Control Bar */
        .control-bar {
            display: flex;
            gap: 14px;
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .name-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 20px;
            font-size: 1.05rem;
            color: #ffffff;
            font-family: inherit;
            outline: none;
        }

        .name-input::placeholder {
            color: #64748b;
        }

        .greet-btn {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            padding: 14px 32px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: all 0.2s ease;
        }

        .greet-btn:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .greet-btn:active {
            transform: scale(0.98);
        }

        @media (max-width: 650px) {
            .app-card {
                padding: 35px 20px;
            }

            .greeting-header {
                font-size: 2.1rem;
            }

            .boxes-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .control-bar {
                flex-direction: column;
                background: transparent;
                padding: 0;
                border: none;
            }

            .name-input {
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 12px;
            }

            .greet-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="app-card">
        <!-- 1. Header with greeting message -->
        <h1 class="greeting-header" id="greetingHeader">Hello</h1>

        <!-- 2. Four interactive color boxes -->
        <div class="boxes-grid">
            <div class="color-box" id="redBox">Red</div>
            <div class="color-box" id="blueBox">Blue</div>
            <div class="color-box" id="greenBox">Green</div>
            <div class="color-box" id="yellowBox">Yellow</div>
        </div>

        <!-- 3. Input field & Greet button -->
        <div class="control-bar">
            <input type="text" id="nameInput" class="name-input" placeholder="Enter your name">
            <button id="greetBtn" class="greet-btn">Greet</button>
        </div>
    </div>

    <!-- JavaScript DOM Logic -->
    <script>
        const greetingHeader = document.getElementById('greetingHeader');
        const nameInput = document.getElementById('nameInput');
        const greetBtn = document.getElementById('greetBtn');

        const redBox = document.getElementById('redBox');
        const blueBox = document.getElementById('blueBox');
        const greenBox = document.getElementById('greenBox');
        const yellowBox = document.getElementById('yellowBox');

        // Greeting Handler
        function handleGreet() {
            const userName = nameInput.value.trim();
            if (userName !== '') {
                greetingHeader.textContent = `Hello, ${userName}`;
            } else {
                greetingHeader.textContent = 'Hello';
            }
        }

        greetBtn.addEventListener('click', handleGreet);
        nameInput.addEventListener('keypress', function (event) {
            if (event.key === 'Enter') {
                handleGreet();
            }
        });

        // Color Box Click Handlers (Toggle Glowing Color Classes)
        redBox.addEventListener('click', function () {
            this.classList.toggle('red-active');
        });

        blueBox.addEventListener('click', function () {
            this.classList.toggle('blue-active');
        });

        greenBox.addEventListener('click', function () {
            this.classList.toggle('green-active');
        });

        yellowBox.addEventListener('click', function () {
            this.classList.toggle('yellow-active');
        });
    </script>
</body>

</html>
