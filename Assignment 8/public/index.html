<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 8: Full Stack To-Do App (Express + MongoDB + React Integration)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <!-- React App Script -->
    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        function App() {
            const [tasks, setTasks] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchQuery, setSearchQuery] = useState('');
            const [statusFilter, setStatusFilter] = useState('all');
            const [priorityFilter, setPriorityFilter] = useState('');

            // Form state
            const [title, setTitle] = useState('');
            const [description, setDescription] = useState('');
            const [priority, setPriority] = useState('medium');

            // 1. Fetch Tasks API Call (GET /api/tasks or /api/tasks/search)
            const fetchTasks = useCallback(async () => {
                setLoading(true);
                try {
                    let url = '/api/tasks';
                    if (searchQuery.trim()) {
                        url = `/api/tasks/search?q=${encodeURIComponent(searchQuery.trim())}`;
                    } else {
                        const params = new URLSearchParams();
                        if (statusFilter !== 'all') params.append('status', statusFilter);
                        if (priorityFilter) params.append('priority', priorityFilter);
                        if (params.toString()) url += `?${params.toString()}`;
                    }

                    const res = await fetch(url);
                    const data = await res.json();
                    if (data.success) {
                        setTasks(data.data || []);
                    }
                } catch (err) {
                    console.error("Failed to fetch tasks from API", err);
                } finally {
                    setLoading(false);
                }
            }, [searchQuery, statusFilter, priorityFilter]);

            useEffect(() => {
                fetchTasks();
            }, [fetchTasks]);

            // 2. Create Task API Call (POST /api/tasks)
            const handleCreateTask = async (e) => {
                e.preventDefault();
                if (!title.trim()) return;

                try {
                    const res = await fetch('/api/tasks', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title, description, priority })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setTitle('');
                        setDescription('');
                        setPriority('medium');
                        fetchTasks();
                    }
                } catch (err) {
                    alert('Error creating task');
                }
            };

            // 3. Toggle Completion API Call (PATCH /api/tasks/:id)
            const handleToggleComplete = async (id, currentStatus) => {
                try {
                    const res = await fetch(`/api/tasks/${id}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ completed: !currentStatus })
                    });
                    const data = await res.json();
                    if (data.success) {
                        fetchTasks();
                    }
                } catch (err) {
                    alert('Error updating task status');
                }
            };

            // 4. Delete Task API Call (DELETE /api/tasks/:id)
            const handleDeleteTask = async (id) => {
                if (!confirm('Are you sure you want to delete this task?')) return;
                try {
                    const res = await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
                    const data = await res.json();
                    if (data.success) {
                        fetchTasks();
                    }
                } catch (err) {
                    alert('Error deleting task');
                }
            };

            // 5. Clear Completed Tasks (DELETE /api/tasks/completed)
            const handleClearCompleted = async () => {
                if (!confirm('Clear all completed tasks?')) return;
                try {
                    const res = await fetch('/api/tasks/completed', { method: 'DELETE' });
                    const data = await res.json();
                    if (data.success) {
                        fetchTasks();
                    }
                } catch (err) {
                    alert('Error clearing completed tasks');
                }
            };

            return (
                <div>
                    {/* Header */}
                    <header className="navbar">
                        <a href="/" className="nav-brand">
                            ⚡ <span>Full Stack To-Do Application</span>
                        </a>
                        <span className="badge" style={{ marginBottom: 0, background: '#f0fdf4', color: '#16a34a', borderColor: '#bbf7d0' }}>
                            Assignment 8: React + Express + MongoDB
                        </span>
                    </header>

                    <main className="container">
                        <section className="hero">
                            <span className="badge">🚀 Node.js, Express.js, MongoDB & React Integration</span>
                            <h1>Full Stack <span>To-Do Application</span></h1>
                            <p>Real-time React hooks state integration with Express.js Controllers, Mongoose Models, and RESTful API endpoints.</p>
                        </section>

                        <div className="app-grid">
                            
                            {/* Add Task Panel */}
                            <aside className="panel">
                                <h2 className="panel-title">➕ Create New Task</h2>
                                <form onSubmit={handleCreateTask}>
                                    <div className="form-group">
                                        <label htmlFor="title">Task Title *</label>
                                        <input 
                                            type="text" 
                                            id="title" 
                                            className="form-input" 
                                            placeholder="e.g. Configure Mongoose Task Model" 
                                            value={title}
                                            onChange={(e) => setTitle(e.target.value)}
                                            required
                                        />
                                    </div>

                                    <div className="form-group">
                                        <label htmlFor="description">Description</label>
                                        <textarea 
                                            id="description" 
                                            className="form-input" 
                                            style={{ height: '80px' }} 
                                            placeholder="Task instructions and details..."
                                            value={description}
                                            onChange={(e) => setDescription(e.target.value)}
                                        ></textarea>
                                    </div>

                                    <div className="form-group">
                                        <label htmlFor="priority">Priority</label>
                                        <select 
                                            id="priority" 
                                            className="form-input"
                                            value={priority}
                                            onChange={(e) => setPriority(e.target.value)}
                                        >
                                            <option value="high">High Priority</option>
                                            <option value="medium">Medium Priority</option>
                                            <option value="low">Low Priority</option>
                                        </select>
                                    </div>

                                    <button type="submit" className="btn btn-primary">
                                        🚀 Add Task (POST /api/tasks)
                                    </button>
                                </form>
                            </aside>

                            {/* Task List Panel */}
                            <section className="panel">
                                
                                {/* Live Search Input */}
                                <div className="search-bar">
                                    <span className="search-icon">🔍</span>
                                    <input 
                                        type="text" 
                                        className="search-input" 
                                        placeholder="Live search tasks by title or description..." 
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                    />
                                </div>

                                {/* Filter Controls */}
                                <div className="filter-bar">
                                    <div className="filter-tabs">
                                        <button 
                                            className={`filter-tab ${statusFilter === 'all' ? 'active' : ''}`}
                                            onClick={() => setStatusFilter('all')}
                                        >
                                            All
                                        </button>
                                        <button 
                                            className={`filter-tab ${statusFilter === 'active' ? 'active' : ''}`}
                                            onClick={() => setStatusFilter('active')}
                                        >
                                            Active
                                        </button>
                                        <button 
                                            className={`filter-tab ${statusFilter === 'completed' ? 'active' : ''}`}
                                            onClick={() => setStatusFilter('completed')}
                                        >
                                            Completed
                                        </button>
                                    </div>

                                    <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                                        <select 
                                            className="form-input" 
                                            style={{ padding: '6px 10px', fontSize: '0.85rem', width: 'auto' }}
                                            value={priorityFilter}
                                            onChange={(e) => setPriorityFilter(e.target.value)}
                                        >
                                            <option value="">All Priorities</option>
                                            <option value="high">High</option>
                                            <option value="medium">Medium</option>
                                            <option value="low">Low</option>
                                        </select>

                                        <button 
                                            className="btn btn-danger" 
                                            style={{ fontSize: '0.8rem', padding: '6px 12px' }}
                                            onClick={handleClearCompleted}
                                        >
                                            🗑️ Clear Completed
                                        </button>
                                    </div>
                                </div>

                                {/* Task Items Grid */}
                                {loading ? (
                                    <div style={{ textAlign: 'center', padding: '40px', color: '#94a3b8' }}>Loading tasks from Express API...</div>
                                ) : tasks.length === 0 ? (
                                    <div style={{ textAlign: 'center', padding: '40px', color: '#94a3b8' }}>No tasks found. Create a new task!</div>
                                ) : (
                                    <div className="task-list">
                                        {tasks.map(task => (
                                            <div className={`task-item ${task.completed ? 'completed' : ''}`} key={task.id}>
                                                <input 
                                                    type="checkbox" 
                                                    className="task-checkbox" 
                                                    checked={task.completed} 
                                                    onChange={() => handleToggleComplete(task.id, task.completed)}
                                                />
                                                <div className="task-content">
                                                    <div className="task-header">
                                                        <span className="task-title">{task.title}</span>
                                                        <span className={`priority-badge priority-${task.priority}`}>{task.priority}</span>
                                                    </div>
                                                    {task.description && <div className="task-desc">{task.description}</div>}
                                                    <div className="task-meta">
                                                        <span style={{ fontFamily: 'monospace', color: '#94a3b8' }}>ID: {task.id}</span>
                                                        <span>Created: {new Date(task.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                                                    </div>
                                                </div>
                                                <div>
                                                    <button className="btn-icon" onClick={() => handleDeleteTask(task.id)} title="Delete Task">🗑️</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </section>
                        </div>
                    </main>

                    <footer>
                        <p>© 2026 To-Do Manager | Assignment 8 Full Stack Application (Express + MongoDB + React)</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
